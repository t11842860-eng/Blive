<!DOCTYPE html>
<html lang="ja">
<head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blive 登録</title>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- 登録画面 -->
    <div class="card" id="form-container">
        <div class="logo">🎥</div>
        <h2>Blive</h2>
        <div class="subtitle">ライブ配信システム登録</div>

        <div id="g_id_onload"
             data-client_id="58094065464-6de6g7hhkv3agjohd3bnhm4ndkurm2ub.apps.googleusercontent.com"
             data-callback="onGoogleLogin">
        </div>

        <div class="google-btn-container">
            <div class="g_id_signin"
                 data-type="standard"
                 data-size="large"
                 data-theme="filled_black"
                 data-text="signup_with">
            </div>
        </div>

        <div class="divider">登録情報</div>

        <div class="form-group">
            <label>メールアドレス</label>
            <input id="email" readonly placeholder="Googleログインしてください">
        </div>

        <div class="form-group">
            <label>氏名</label>
            <input id="name" readonly placeholder="Googleログインしてください">
        </div>

        <div class="form-group">
            <label>自動取得情報</label>
            <input id="user-info" readonly placeholder="Googleログイン後表示されます">
        </div>

        <button onclick="sendData()">登録する</button>
    </div>

    <!-- 待機画面 -->
    <div class="card waiting-card" id="waiting-container">
        <div class="logo">🎥</div>

        <div class="spinner"></div>

        <h2>しばらくお待ちください</h2>

        <p>
            配信サーバー（ラズパイ）に接続し、<br>
            専用視聴URLを発行しています...<br>
            <span class="waiting-note">
                自動で画面が切り替わります
            </span>
        </p>
    </div>

    <!-- 完了画面 -->
    <div class="card success-card" id="success-container">
        <div class="logo">🎥</div>

        <h2 class="success-title">準備完了！</h2>

        <p>
            専用アクセスURLが発行されました。
        </p>

        <a id="stream-link"
           target="_blank"
           class="stream-btn">
            配信視聴ルームへ入る
        </a>
    </div>

    <script src="script.js"></script>

</body>
</html>
